databases:
  - name: codesanook-db
    plan: free
    databaseName: codesanook
    user: codesanook

services:
  - type: web
    name: codesanook-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn codesanook_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: "https://codesanook.netlify.app"
      - key: DATABASE_URL
        fromDatabase:
          name: codesanook-db
          property: connectionString
